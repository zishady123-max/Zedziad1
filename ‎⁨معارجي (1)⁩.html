<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>معارجي</title>

<style>
/* Layout: calm study desk. Sidebar (right) on desktop, bottom bar on phones. Flat sections, hairlines, round check circles. */
:root{
  --bg:#eef2f0;--card:#fbfcfb;--ink:#1d2d29;--mut:#677a73;--line:#dbe4e0;
  --acc:#2d6a60;--acc-soft:#e1eeea;--gold:#9a7a3e;--on-acc:#ffffff;--warn:#b0643c;
  --f-ui:"IBM Plex Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif;
  --f-disp:"Aref Ruqaa","IBM Plex Sans Arabic",serif;
  --side:224px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1514;--card:#141e1c;--ink:#e3ece8;--mut:#8ea29a;--line:#233431;
  --acc:#62c4b0;--acc-soft:#173029;--gold:#d2b06a;--on-acc:#0d1514;--warn:#e09a72;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514;--card:#141e1c;--ink:#e3ece8;--mut:#8ea29a;--line:#233431;
  --acc:#62c4b0;--acc-soft:#173029;--gold:#d2b06a;--on-acc:#0d1514;--warn:#e09a72;color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.85 var(--f-ui);
}
.emo{filter:grayscale(.55) opacity(.8);font-style:normal}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px 10px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
textarea{width:100%;min-height:84px;resize:vertical}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
/* nav */
nav{position:sticky;top:0;align-self:start;height:100vh;padding:28px 18px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{font:700 30px/1.2 var(--f-disp);color:var(--acc);margin:0 10px 22px}
nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--mut);padding:9px 12px;border-radius:11px;text-align:start;font-weight:500}
nav button .emo{font-size:18px;width:24px;text-align:center}
nav button.on{background:var(--acc-soft);color:var(--acc)}
nav button:hover:not(.on){color:var(--ink)}
.navfoot{margin-top:auto;font-size:13px;color:var(--mut);padding:0 12px}
main{padding-block:30px 110px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));max-width:980px;width:100%}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:6px}
h1{font:700 30px/1.3 var(--f-disp);margin:0;color:var(--ink)}
.sub{color:var(--mut);font-size:14px}
.quote{color:var(--gold);font:700 17px/1.8 var(--f-disp);margin:2px 0 18px}
h2{font:600 17px/1.5 var(--f-ui);margin:0}
h3{font:600 15.5px/1.6 var(--f-ui);margin:0}
.pill{font-size:12.5px;color:var(--acc);background:var(--acc-soft);border-radius:20px;padding:0 10px;white-space:nowrap;display:inline-block;line-height:1.7}
.pill.g{color:var(--gold);background:transparent;border:1px solid var(--line)}
.mut{color:var(--mut)}.sm{font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:3px 14px;font-size:14px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.pri:hover{color:var(--on-acc);opacity:.92}
.btn.sm{padding:0 10px;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:2px 14px 2px 10px;background:var(--card);font-size:14px}
.sw.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
/* day strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:14px 0 18px}
.strip button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.35}
.strip button b{font-weight:600;font-size:14px}
.strip button small{color:var(--mut);font-size:11.5px}
.strip button i{display:block;height:3px;width:58%;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.strip button i u{display:block;height:100%;background:var(--acc);width:0}
.strip button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.strip button.on small{color:var(--on-acc);opacity:.85}
.strip button.on i{background:rgba(255,255,255,.3)}
.strip button.on i u{background:var(--on-acc)}
.strip button.now:not(.on){border-color:var(--acc)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:6px;transition:width .3s}
/* sections */
.sec{padding:16px 0 12px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sh{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:4px}
.sh .when{color:var(--mut);font-size:13px}
.row{display:flex;align-items:flex-start;gap:12px;padding:7px 0}
.row+.row{border-top:1px dashed var(--line)}
.row .t{flex:1;min-width:0}
.row small{display:block;color:var(--mut);font-size:13px;line-height:1.6}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:3px 0 0;padding:0;border:1.8px solid var(--mut);border-radius:50%;background:transparent;cursor:pointer;position:relative}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
input[type=checkbox]:checked::after{content:"";position:absolute;inset:4px 6px 6px 6px;border:solid var(--on-acc);border-width:0 2px 2px 0;transform:rotate(40deg)}
.pi{width:100%;margin-top:3px;font-size:13.5px;padding:1px 9px;background:transparent;border-style:dashed}
.fin{flex:none;border:1px solid var(--line);background:none;color:var(--acc);border-radius:9px;font-size:12.5px;padding:0 10px;margin-top:3px}
.fin:hover{border-color:var(--acc)}
.done .tt{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--line)}
.note{color:var(--mut);font-size:14px;padding:6px 0}
.en{direction:ltr;text-align:left;font:400 15px/1.5 system-ui,sans-serif}
.tagx{font-size:11.5px;color:var(--gold);border:1px solid var(--line);border-radius:8px;padding:0 6px;margin-inline-start:6px}
.ex{font-size:11.5px;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:0 6px;margin-inline-start:6px}
/* edit controls */
.ed{width:100%;padding:2px 9px}
.ctl{display:none;flex:none;gap:2px}
.em .ctl{display:inline-flex}
.ctl button{border:0;background:none;color:var(--mut);padding:0 6px;font-size:15px;border-radius:7px}
.ctl button:hover{background:var(--acc-soft);color:var(--acc)}
.ctl .x:hover{color:var(--warn)}
.edbar{display:none;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0}
.em .edbar{display:flex}
.edbar label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.edbar input[type=number]{width:70px}
.noem{display:block}.em .noem{display:none}
.yesem{display:none}.em .yesem{display:block}
.fab{position:fixed;inset-inline-start:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.fab.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
/* curriculum */
.grp{font-size:13px;color:var(--gold);letter-spacing:.04em;margin:26px 0 6px}
details{border-top:1px solid var(--line);padding:2px 0}
summary{cursor:pointer;padding:10px 0;display:flex;align-items:center;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:7px;height:7px;border:solid var(--mut);border-width:0 0 1.6px 1.6px;transform:rotate(45deg);transition:transform .2s;flex:none;margin-inline-end:4px}
details[open]>summary::before{transform:rotate(-45deg)}
summary .nm{font-weight:600;flex:1;min-width:0}
.stg{margin:8px 0 2px;display:flex;align-items:center;gap:8px;color:var(--acc);font-size:14px;font-weight:600}
.stg .ed{width:auto;flex:1}
.focus{background:var(--acc-soft);border-radius:14px;padding:12px 16px;margin:10px 0 4px}
.sel{max-width:170px;font-size:13px;padding:0 6px}
.kv{display:flex;align-items:center;gap:10px;padding:6px 0}
.kv>span{flex:1}
/* week */
.sc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.sc .n{display:flex;gap:4px}
.sc label{cursor:pointer;min-width:34px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:0 6px;font-size:14px}
.sc input{display:none}
.sc label:has(input:checked){background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.hrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.hrs div{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.hrs b{font:600 22px/1.3 var(--f-ui);display:block;font-variant-numeric:tabular-nums}
.box{border:1px solid var(--line);border-radius:14px;padding:6px 16px 12px;margin:12px 0;background:var(--card)}
.box>h3{margin:10px 0 2px}
/* dialog, toast */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:20px 22px;width:min(420px,92vw);font-family:var(--f-ui)}
dialog::backdrop{background:rgba(10,20,18,.45)}
dialog h3{margin-bottom:10px}
.fld{display:flex;flex-direction:column;gap:3px;margin:8px 0}
.fld>span{font-size:13px;color:var(--mut)}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.chs label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:14px}
.chs input{width:18px;height:18px;margin:0}
.dbtn{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}
#toast{position:fixed;inset-inline:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:30;pointer-events:none}
#toast div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 16px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:92vw}
#toast button{border:0;background:none;color:var(--gold);font-weight:600;padding:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #toast button{color:#7a5a1c}}
:root[data-theme="dark"] #toast button{color:#7a5a1c}
.sec,.box,details{scroll-margin-top:16px}
section.tab{display:none}section.tab.on{display:block}
/* phone */
@media (max-width:760px){
  .app{display:block}
  nav{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));gap:0;border-top:1px solid var(--line);border-inline-end:0;z-index:15;justify-content:space-around}
  .brand,.navfoot{display:none}
  nav button{flex-direction:column;gap:0;padding:4px 2px;font-size:11.5px;flex:1;justify-content:center;align-items:center;text-align:center;border-radius:10px}
  nav button .emo{font-size:18px;line-height:1.3}
  main{padding-block:20px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:25px}
  .fab{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  .strip{gap:4px}.strip button{padding:6px 0 5px}.strip button b{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function migrate(){let old=null;try{old=JSON.parse(localStorage.getItem('maarij')||'null')}catch(e){}
 if(!old)return;const nm=n=>String(n).replace(/\s*\((مع الشيخ[^)]*)\)/,'').trim();
 const all=allB('cur').concat(allB('rd'));
 Object.keys(old.c||{}).forEach(k=>{const b=all.find(x=>x.n==nm(k));if(b&&old.c[k]!=null)b.st=old.c[k]});
 Object.keys(old.p||{}).forEach(k=>{const b=all.find(x=>x.n==nm(k));if(b&&old.p[k])b.pos=old.p[k]});
 const lec=S.lec;Object.keys(old.u||{}).forEach(k=>{const l=lec.find(x=>x.n==k);if(l&&old.u[k])l.done=1});
 if(old.e)S.e=old.e}

 ['done','pos','asg','g','e','wp','dc','focus','ui','qt'].forEach(k=>S[k]=S[k]||{});S.mx=S.mx||2;S.rmx=S.rmx||2}

function curBook(s){for(const st of s.stages){const un=st.books.filter(b=>b.st!=2);if(!un.length)continue;const c=un.filter(b=>!b.ex);if(!c.length)return null;return{b:c.find(b=>b.st==1)||c[0],st}}return null}
function waiting(s){return s.stages.some(st=>st.books.some(b=>b.st!=2))&&!curBook(s)}
function pairs(){const act=S.cur.filter(s=>!s.off&&curBook(s)),P=[];for(let i=0;i<act.length;i+=2){const b=act[i+1]||(act.length>1?act[0]:null);P.push([act[i],b])}return P}
function pairFor(ws){const f=S.focus[dk(ws)];if(f)return f.map(id=>S.cur.find(s=>s.id==id)||null);const P=pairs();if(!P.length)return[null,null];const w=weekNum(ws)-S.a;return P[((w%P.length)+P.length)%P.length]}
function rdPick(item,d){const act=allB('rd').filter(b=>b.st==1);if(act.length)return act[(dayNum(d)+(item.off||0))%act.length];return allB('rd').find(b=>b.st!=2)||null}
function syncSt(b){allB('cur').concat(allB('rd')).forEach(x=>{if(x!==b&&x.n==b.n){x.st=b.st;if(b.pos)x.pos=b.pos}})}
function nextOf(id){const o=IDX[id];if(!o)return null;const flat=o.s.stages.flatMap(st=>st.books),i=flat.findIndex(b=>b.id==id);return flat.slice(i+1).concat(flat.slice(0,i)).find(b=>b.st!=2)||null}

  '<div class="box"><h3>خطوات المراجعة</h3>'+S.wr.map(x=>'<div class="row'+(wchk(x.id)?' done':'')+'"><input type="checkbox" data-a="wchk" data-k="wk|'+key+'|'+x.id+'"'+(wchk(x.id)?' checked':'')+'><span class="t">'+(EM?edi(x.id,'n',x.n):'<span class="tt">'+esc(x.n)+'</span>')+'</span>'+ctl(x.id)+'</div>').join('')+'<div class="edbar"><button class="btn sm" data-a="addwr">+ خطوة</button></div></div>'+
  '<div class="box"><h3>تقييم الأسبوع</h3>'+S.ev.map(x=>'<div class="sc"><span>'+(EM?edi(x.id,'n',x.n):esc(x.n))+'</span><span class="n">'+[1,2,3,4,5].map(v=>'<label><input type="radio" name="r'+x.id+'" data-a="eval" data-i="'+x.id+'" data-v="'+v+'"'+(e.r[x.id]==v?' checked':'')+'>'+num(v)+'</label>').join('')+'</span>'+ctl(x.id)+'</div>').join('')+
  '<div class="edbar"><button class="btn sm" data-a="addev">+ معيار</button></div><p>المجموع: <b>'+num(sum)+'</b> من '+num(S.ev.length*5)+'</p><div class="sm mut">ما الذي أنجزته؟ وما الذي عطّلني؟</div><textarea id="evn" data-a="evn" aria-label="ملاحظات الأسبوع">'+esc(e.n)+'</textarea></div>'+
  '<div class="box"><h3>ترتيب الأسبوع القادم · '+esc(fmt(nw,{day:'numeric',month:'long'}))+'</h3>'+[0,1,2].map(i=>'<input class="ed" style="margin:5px 0" data-a="wgoal" data-i="'+i+'" placeholder="هدف '+num(i+1)+'" value="'+esc(np.goals[i])+'">').join('')+
  '<div class="kv"><span class="sm">فنّا المنهج: <b>'+esc(pn[0]?pn[0].n:'—')+'</b>'+(pn[1]?' و<b>'+esc(pn[1].n)+'</b>':'')+'</span></div>'+
  '<div class="edbar" style="display:flex"><label>الأول <select class="sel" data-a="fcs" data-w="next" data-i="0">'+sciOpts(pn[0]&&pn[0].id)+'</select></label><label>الثاني <select class="sel" data-a="fcs" data-w="next" data-i="1">'+sciOpts(pn[1]&&pn[1].id)+'</select></label>'+(S.focus[nk]?'<button class="btn sm" data-a="fcauto" data-w="next">عودة للتلقائي</button>':'')+'</div></div>'+
  '<div class="box"><h3>الابتعاد عن المشتتات</h3>'+S.dis.map(x=>'<div class="row"><input type="checkbox" data-a="dchk" data-i="'+x.id+'"'+(S.dc[x.id]?' checked':'')+'><span class="t">'+(EM?edi(x.id,'n',x.n):esc(x.n))+'</span>'+ctl(x.id)+'</div>').join('')+'<div class="edbar"><button class="btn sm" data-a="adddis">+ بند</button></div></div>'+
  '<details data-id="data"><summary><span class="nm">نسخة احتياطية</span></summary><p class="note">انسخ النص واحفظه، أو الصق نسخة سابقة ثم اضغط استيراد.</p><textarea id="bk" aria-label="نسخة البيانات"></textarea><div class="tools" style="margin-top:8px"><button class="btn" data-a="exp">نسخ البيانات</button><button class="btn" data-a="imp">استيراد</button><button class="btn" data-a="reset">إعادة الضبط</button></div></details>'}

/* ============ العرض ============ */
function render(){reindex();$('#app').classList.toggle('em',EM);
 $('#nav').innerHTML='<div class="brand">معارجي</div>'+TABS.map(([k,t,e])=>'<button data-a="tab" data-k="'+k+'" class="'+(k==TAB?'on':'')+'"><span class="emo">'+e+'</span>'+t+'</button>').join('');
 renderDay();renderCat('cur');renderCat('rd');renderMem();renderIb();renderUni();renderWk();
 document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('on',s.id=='t-'+TAB));
 const f=$('#fab');f.classList.toggle('on',EM);f.textContent=EM?'✓ تم':'✎ تعديل';f.setAttribute('aria-pressed',EM)}
function show(k){TAB=k;try{history.replaceState(null,'','#'+k)}catch(e){}render();window.scrollTo(0,0)}

/* ============ الأحداث ============ */
const A={
 tab:el=>show(el.dataset.k),
 day:el=>{SEL=+el.dataset.i;render()},
 wnav:el=>{const v=+el.dataset.v;if(v==0){WKS=wStart(today);SEL=dIdx(today)}else{WKS=new Date(WKS);WKS.setDate(WKS.getDate()+7*v)}render()},
 em:()=>{EM=!EM;render()},
 exam:()=>{S.exam=S.exam?0:1;save();render()},
 undo:()=>{if(window.__undo)window.__undo();$('#toast').innerHTML=''},
 up:el=>mv(el.dataset.i,-1),dn:el=>mv(el.dataset.i,1),
 del:el=>{const l=loc(el.dataset.i);if(!l)return;const nm=(l[0][l[1]].n||l[0][l[1]].t||'البند');mut(()=>l[0].splice(l[1],1),'حُذف: '+nm)},
 fin:el=>{const o=IDX[el.dataset.b];if(!o)return;mut(()=>{o.b.st=2;syncSt(o.b);if(o.k=='rd')fillRd();if(el.dataset.i)advance(el.dataset.i)},'أحسنت! أتممت «'+o.b.n+'»')},
 adv:el=>mut(()=>advance(el.dataset.i)),
 mfin:el=>mut(()=>{const m=S.matn.find(x=>x.id==el.dataset.i);if(m){m.st=2;fillMatn()}},'تم حفظ المتن. بدأ التالي تلقائيًا.'),
 unlock:el=>mut(()=>{const g=S.wo.find(x=>x.id==el.dataset.i);if(g)g.on=1},'فُعّلت المرحلة التالية'),
 anchor:()=>mut(()=>{S.a=weekNum(WKS)},'بدأت الدورة من هذا الأسبوع'),
 fcauto:el=>{delete S.focus[dk(wkOf(el))];save();render()},
 resetday:()=>ask('استعادة جدول '+DN[SEL],[{msg:'سيُستبدل جدول هذا اليوم بالجدول الافتراضي. يمكنك التراجع بعدها.'}],()=>mut(()=>{S.days[SEL]=defDays()[SEL]},'استُعيد الجدول'),'استعادة'),
 addsec:()=>ask('قسم جديد',[{k:'t',label:'الاسم',ph:'مثال: مراجعة اللغة'},{k:'min',label:'الدقائق',type:'number',val:30},{k:'when',label:'الوقت (اختياري)'},{k:'first',label:'أول بند (اختياري)'},{k:'days',label:'الأيام',type:'checks',opts:DN.map((n,i)=>[String(i),n]),val:[String(SEL)]}],v=>{if(!v.t.trim())return;mut(()=>{(v.days.length?v.days:[String(SEL)]).forEach(d=>S.days[d].splice(Math.max(0,S.days[d].length-1),0,sec(v.t.trim(),+v.min||0,v.first.trim()?[it('t',{t:v.first.trim()})]:[],{when:v.when})))},'أُضيف القسم')},'إضافة'),
 cpsec:el=>{const l=loc(el.dataset.i);if(!l)return;const s0=l[0][l[1]];ask('نسخ «'+s0.t+'» إلى',[{k:'days',type:'checks',label:'الأيام',opts:DN.map((n,i)=>[String(i),n]).filter(x=>+x[0]!=SEL),val:[]}],v=>mut(()=>{v.days.forEach(d=>{const c=JSON.parse(JSON.stringify(s0));c.id=uid();c.items.forEach(x=>{if(x.k=='t'&&x.pos&&!x.pk)x.pk=x.id;x.id=uid()});S.days[d].push(c)})},'نُسخ القسم'),'نسخ')},
 addit:el=>ask('بند جديد',[{k:'k',label:'النوع',type:'select',val:'t',opts:[['t','مهمة نصية'],['m','المتن الجاري (تلقائي)'],['b','كتاب محدد'],['c','المنهج المكتوب (فنّا الأسبوع)'],['r','القراءة (تلقائي)'],['u','محاضرة الجامعة (تلقائي)'],['w','العبادات']]},{k:'t',label:'النص (للمهمة النصية)'}],v=>mut(()=>{const l=loc(el.dataset.i);if(!l)return;const s0=l[0][l[1]];s0.items.push(it(v.k,v.k=='t'?{t:v.t.trim()||'مهمة جديدة'}:v.k=='c'?{slot:0}:v.k=='b'?{bid:''}:{}))},'أُضيف البند'),'إضافة'),
 addsci:el=>{const k=el.dataset.k;ask('إضافة',[{k:'n',label:'الاسم'}].concat(k=='cur'?[{k:'grp',label:'المجموعة',type:'select',val:'gaya',opts:[['bag','الحقائب'],['alat','علوم الآلة'],['gaya','علوم الغاية']]}]:[]),v=>{if(!v.n.trim())return;mut(()=>S[k].push({id:uid(),grp:k=='cur'?v.grp:'add',n:v.n.trim(),off:0,stages:[{id:uid(),n:'المرحلة ١',books:[]}]}),'أُضيف')},'إضافة')},
 addstage:el=>ask('مرحلة جديدة',[{k:'n',label:'الاسم',val:'مرحلة جديدة'}],v=>mut(()=>{const l=loc(el.dataset.i);if(l)l[0][l[1]].stages.push({id:uid(),n:v.n.trim()||'مرحلة',books:[]})}),'إضافة'),
 addbook:el=>ask('كتاب جديد',[{k:'n',label:'اسم الكتاب'}],v=>{if(!v.n.trim())return;mut(()=>{const l=loc(el.dataset.i);if(l)l[0][l[1]].books.push({id:uid(),n:v.n.trim(),st:0,pos:'',ex:0,add:0})})},'إضافة'),
 addmatn:()=>ask('متن جديد',[{k:'n',label:'اسم المتن'}],v=>{if(v.n.trim())mut(()=>{S.matn.push({id:uid(),n:v.n.trim(),st:0});fillMatn()})},'إضافة'),
 addline:el=>ask('سطر جديد',[{k:'t',label:'النص'}],v=>{if(v.t.trim())mut(()=>{const l=loc(el.dataset.i);if(l)l[0][l[1]].lines.push({id:uid(),t:v.t.trim()})})},'إضافة'),
 addgrp:()=>ask('قسم حفظ جديد',[{k:'n',label:'الاسم'}],v=>{if(v.n.trim())mut(()=>{const id=uid();S.mm.push({id,n:v.n.trim(),pk:'g'+id,lines:[]})})},'إضافة'),
 addwo:()=>ask('مرحلة عبادات',[{k:'n',label:'الاسم'}],v=>{if(v.n.trim())mut(()=>S.wo.push({id:uid(),n:v.n.trim(),on:0,items:[]}))},'إضافة'),
 addwi:el=>ask('بند عبادة',[{k:'n',label:'النص'}],v=>{if(v.n.trim())mut(()=>{const l=loc(el.dataset.i);if(l)l[0][l[1]].items.push({id:uid(),n:v.n.trim()})})},'إضافة'),
 addlec:()=>ask('محاضرة جديدة',[{k:'n',label:'Lecture title (English)'},{k:'pos',label:'مكانها',type:'select',val:'end',opts:[['end','في النهاية'],['next','التالية مباشرة'],['start','في البداية']]}],v=>{if(!v.n.trim())return;mut(()=>{const o={id:uid(),n:v.n.trim(),done:0},L=S.lec;if(v.pos=='start')L.unshift(o);else if(v.pos=='next'){const i=L.findIndex(x=>!x.done);L.splice(i<0?L.length:i,0,o)}else L.push(o)},'أُضيفت المحاضرة')},'إضافة'),
 addwr:()=>ask('خطوة مراجعة',[{k:'n',label:'النص'}],v=>{if(v.n.trim())mut(()=>S.wr.push({id:uid(),n:v.n.trim()}))},'إضافة'),
 addev:()=>ask('معيار تقييم',[{k:'n',label:'النص'}],v=>{if(v.n.trim())mut(()=>S.ev.push({id:uid(),n:v.n.trim()}))},'إضافة'),
 adddis:()=>ask('بند',[{k:'n',label:'النص'}],v=>{if(v.n.trim())mut(()=>S.dis.push({id:uid(),n:v.n.trim()}))},'إضافة'),
 exp:()=>{const t=$('#bk');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('نُسخت البيانات'),()=>toast('حدّد النص وانسخه'))}catch(e){toast('حدّد النص وانسخه')}},
 imp:()=>{try{const o=JSON.parse($('#bk').value);if(!o.cur||!o.days)throw 0;mut(()=>{S=o},'استُوردت البيانات')}catch(e){toast('النص غير صالح')}},
 reset:()=>ask('إعادة الضبط',[{msg:'ستُمسح كل التعديلات والتقدم، وتعود البيانات الافتراضية.'}],()=>mut(()=>{seed()},'أُعيد الضبط'),'إعادة')
};
function wkOf(el){const w=new Date(WKS);if(el.dataset.w!='this')w.setDate(w.getDate()+7);return w}
function mv(id,dir){mut(()=>{const l=loc(id);if(!l)return;const j=l[1]+dir;if(j<0||j>=l[0].length)return;const a=l[0];[a[l[1]],a[j]]=[a[j],a[l[1]]]})}
function advance(itemId){const l=loc(itemId);if(!l)return;const x=l[0][l[1]],old=x.bid,nb=nextOf(old);if(!nb){x.bid='';return}nb.ex=1;
 Object.keys(S.days).forEach(d=>S.days[d].forEach(s=>s.items.forEach(i=>{if(i.k=='b'&&i.bid==old)i.bid=nb.id})))}
const C={
 f:(el)=>{const l=loc(el.dataset.i);if(!l)return;const o=l[0][l[1]],f=el.dataset.f;let v=el.type=='checkbox'?(el.checked?1:0):el.dataset.n?+el.value:el.value;
  mut(()=>{o[f]=v;if(f=='st'&&IDX[o.id])syncSt(o);if(f=='st'&&v==2){if(IDX[o.id]&&IDX[o.id].k=='rd')fillRd();if(S.matn.includes(o))fillMatn()}if(f=='pos'&&v&&!o.pk)o.pk=o.id})},
 chk:el=>{const k=el.dataset.k;if(el.checked)S.done[k]=1;else delete S.done[k];
  const b=el.dataset.b&&IDX[el.dataset.b];if(b&&el.checked&&b.b.st==0){b.b.st=1;syncSt(b.b)}
  if(el.dataset.u){const l=lec(el.dataset.u);if(l)l.done=el.checked?1:0}
  const m=el.dataset.m&&S.matn.find(x=>x.id==el.dataset.m);if(m&&el.checked&&m.st==0)m.st=1;save();render()},
 wchk:el=>{if(el.checked)S.done[el.dataset.k]=1;else delete S.done[el.dataset.k];save();render()},
 lec:el=>{const l=lec(el.dataset.i);if(l){l.done=el.checked?1:0;if(l.done)l.dd=el.dataset.d||dk(today);else delete l.dd;save();render()}},
 qt:el=>{const v=el.value.trim();if(v)S.qt[el.dataset.k]=v;else delete S.qt[el.dataset.k];save()},
 pos:el=>{S.pos[el.dataset.k]=el.value;save()},
 bpos:el=>{const o=IDX[el.dataset.i];if(o){o.b.pos=el.value;syncSt(o.b);save()}},
 goal:el=>{S.g[dk(dateOf(SEL))]=el.value;save()},
 evn:el=>{S.e[dk(WKS)].n=el.value;save()},
 eval:el=>{const e=S.e[dk(WKS)];e.r[el.dataset.i]=+el.dataset.v;save();render()},
 wgoal:el=>{const nw=new Date(WKS);nw.setDate(nw.getDate()+7);const np=S.wp[dk(nw)];np.goals[+el.dataset.i]=el.value;save()},
 dchk:el=>{S.dc[el.dataset.i]=el.checked?1:0;save()},
 mx:el=>{S.mx=+el.value;fillMatn();save();render()},
 rmx:el=>{S.rmx=+el.value;fillRd();save();render()},
 fcs:el=>{const w=wkOf(el),p=pairFor(w).map(s=>s?s.id:'');p[+el.dataset.i]=el.value;S.focus[dk(w)]=p;save();render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||/^(INPUT|SELECT|TEXTAREA|OPTION)$/.test(el.tagName))return;const h=A[el.dataset.a];if(h){e.preventDefault();h(el,e)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-a]');if(!el)return;const h=C[el.dataset.a];if(h)h(el,e)});
document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName=='DETAILS'&&d.dataset.id&&e.target.closest('main')){const id=d.dataset.id;if(d.open)S.ui[id]=1;else delete S.ui[id];save()}},true);

load();WKS=wStart(today);SEL=dIdx(today);
const h0=(location.hash||'').slice(1);TAB=TABS.some(t=>t[0]==h0)?h0:'day';
render();
})();
</script>

</body></html>
